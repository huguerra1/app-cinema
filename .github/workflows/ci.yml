name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Os testes usam mocks do Prisma; estes valores só satisfazem a configuração.
      DATABASE_URL: postgresql://user:password@localhost:5432/cinema_db?schema=public
      JWT_SECRET: segredo-apenas-para-testes-do-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx jest --runInBand
      - run: npx jest --config ./test/jest-e2e.json --runInBand

  # Aplica todas as migrations e o seed num Postgres de verdade e sobe a API para um teste rápido.
  banco:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cinema_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d cinema_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/cinema_db?schema=public
      JWT_SECRET: segredo-apenas-para-testes-do-ci
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: senha-do-admin-no-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      # O seed precisa ser idempotente: a segunda vez não pode falhar nem duplicar.
      - run: npx prisma db seed
      - run: npm run build
      - name: API responde, o admin faz login e um usuário comum não escreve no catálogo
        run: |
          node dist/src/main &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/movie > /dev/null && break; sleep 2; done
          ADMIN=$(curl -fsS -X POST http://localhost:3000/api/users/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"senha-do-admin-no-ci"}')
          echo "$ADMIN" | grep -q 'access_token'
          curl -fsS -X POST http://localhost:3000/api/users -H 'Content-Type: application/json' \
            -d '{"name":"Cliente CI","email":"cliente@example.com","password":"senha-do-cliente-1"}' > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/users/login -H 'Content-Type: application/json' \
            -d '{"email":"cliente@example.com","password":"senha-do-cliente-1"}' | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/genre \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"Teste"}')
          echo "POST /genre como USER: $STATUS"
          test "$STATUS" = "403"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
