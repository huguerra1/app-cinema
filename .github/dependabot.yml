version: 2
updates:
  # Backend e painel web são workspaces do npm: o CI instala pelo package-lock.json da raiz,
  # então o Dependabot precisa atualizar a raiz (apontar para /backend ou /frontend deixava
  # o lockfile da raiz desatualizado e quebrava o `npm ci`).
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Versões major de frameworks cujos pacotes precisam subir juntos chegam num PR só
      # (por exemplo, @nestjs/testing 12 com @nestjs/core 11 quebra o build).
      nestjs:
        patterns: ['@nestjs/*']
        update-types: [major]
      prisma:
        patterns: ['prisma', '@prisma/*']
        update-types: [major]
      menores:
        update-types: [minor, patch]
    ignore:
      # O TypeScript 7 ainda não é aceito pelo typescript-eslint 8 (o `npm ci` falha com ERESOLVE).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # App mobile (Expo): as versões das bibliotecas precisam bater com o SDK do Expo, então a
  # atualização é feita de uma vez com `npx expo install --fix` (ver ROADMAP). Aqui ficam só
  # as atualizações de segurança (limite 0 desliga as de versão).
  - package-ecosystem: npm
    directory: /mobile
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
